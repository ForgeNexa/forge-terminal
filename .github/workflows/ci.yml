name: Forge Terminal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  supervisor-tests:
    name: PTY Supervisor Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Run PTY Tests
        run: |
          cd supervisor
          go test -v ./...

  web-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install & Build Frontend
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build
